[project]
name = "agent-service"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.19.1,<2",
    "asyncmy>=0.2.14,<0.3",
    "fastapi[standard-no-fastapi-cloud-cli]>=0.141.1,<1",
    "google-genai",
    "prompt-toolkit",
    "pydantic-settings>=2.15,<3",
    "pyyaml",
    "rich",
    "sqlalchemy[asyncio]>=2.0.52,<2.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_service"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
markers = [
    "unit: 单元测试，只验证单个模块或工具的行为",
    "integration: 集成测试，验证项目内部模块之间的协作",
    "external: 真实外部环境测试，需要操作系统进程、网络或真实 API",
]

[tool.pyright]
include = ["src", "tests"]
extraPaths = ["src"]
venvPath = "."
venv = ".venv"
pythonVersion = "3.14"

[dependency-groups]
dev = [
    "pyright>=1.1.411",
    "ruff>=0.16.3",
    "pytest",
    "pytest-asyncio",
]
