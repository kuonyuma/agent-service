[project]
name = "agent-service"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "google-genai",
    "prompt-toolkit",
    "pyyaml",
    "rich",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_service"]