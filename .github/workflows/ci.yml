name: Python CI

on:
  push:
    branches:
      - main
      - feature/src-layout
  pull_request:

  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 获取代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: 安装项目依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install --group dev .

      - name: 运行单元测试
        run: python -m pytest -q tests/unit

      - name: 运行集成测试
        run: python -m pytest -q tests/integration

      - name: 运行 Ruff
        run: python -m ruff check .

      - name: 运行 Pyright
        run: python -m pyright