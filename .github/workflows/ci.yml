name: Python CI

on:
  push:
    branches:
      - main
      - develop
      - feature/src-layout
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_FROZEN: "true"

jobs:
  quality:
    name: Ruff 与 Pyright
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 获取代码
        uses: actions/checkout@v4

      - name: 安装 uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.20"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: 安装 Python
        run: uv python install 3.14

      - name: 从锁文件同步依赖
        run: uv sync --frozen --all-groups

      - name: 运行 Ruff
        run: uv run --frozen ruff check .

      - name: 运行 Pyright
        run: uv run --frozen pyright

  windows-tests:
    name: Windows 单元与内部集成测试
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: 获取代码
        uses: actions/checkout@v4

      - name: 安装 uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.20"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: 安装 Python
        run: uv python install 3.14

      - name: 从锁文件同步依赖
        run: uv sync --frozen --all-groups

      - name: 运行测试
        shell: pwsh
        run: >-
          uv run --frozen pytest -q tests/unit tests/integration
          --basetemp "$env:RUNNER_TEMP\agent-service-pytest"
